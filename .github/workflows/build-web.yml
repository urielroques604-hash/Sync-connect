name: Build Flutter Web

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: >-
          flutter build web --release
          --dart-define=BOT_API_URL=https://app.syncconnect.online
          --dart-define=PUBLIC_WEB_URL=https://app.syncconnect.online
      - uses: actions/upload-artifact@v4
        with:
          name: sync-connect-web
          path: build/web/
