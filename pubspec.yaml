name: sync_connect_business
description: CRM, ventas, inventario y compras para pequeños negocios.
publish_to: none
version: 0.2.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.1.1
  shared_preferences: ^2.5.3
  file_picker: ^11.0.3
  excel_plus: ^2.29.3
  image: ^4.8.0
  intl: ^0.20.2
  http: ^1.6.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sync_connect_logo.png
